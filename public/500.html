<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Something went wrong · MediLink</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Onest", -apple-system, BlinkMacSystemFont, sans-serif;
        background: #F7FAFC;
        color: #0F172A;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      .container { max-width: 480px; }
      .emoji { font-size: 5rem; margin-bottom: 1.5rem; }
      .code {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        color: #F43F5E;
        background: #FFE4E6;
        padding: 0.375rem 0.875rem;
        border-radius: 999px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 1rem;
        color: #64748B;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        background: #00D4E6;
        color: white;
        text-decoration: none;
        padding: 0.875rem 2rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9375rem;
        transition: background 0.15s ease;
      }
      a:hover { background: #00A8B8; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="emoji">💊</div>
      <span class="code">Error 500</span>
      <h1>Something went wrong</h1>
      <p>Something didn't go as planned. Please try again in a moment, or head back to the home page.</p>
      <a href="/">Back to home</a>
    </div>
  </body>
</html>
